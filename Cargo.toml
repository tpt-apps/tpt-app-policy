[workspace]
resolver = "2"
members = [
    "crates/tpt-policy-core",
    "crates/tpt-schema",
    "crates/tpt-report",
    "crates/tpt-commercial-cli",
    "crates/tpt-app-policy",
    "crates/tpt-data-core",
    "crates/tpt-data",
    "crates/tpt-document",
    "crates/tpt-invoice",
    "crates/tpt-transform",
    "crates/tpt-approve",
    "crates/tpt-evidence",
    "crates/tpt-ai-guard",
]

[workspace.package]
version = "2026.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-apps/tpt-app-policy"
publish = false

[workspace.dependencies]
# Shared third-party dependencies. Added here as each phase needs them.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
tiny_http = "0.12"
sha2 = "0.11"
csv = "1"
quick-xml = "0.42"
regex = "1"

# Internal crates
tpt-policy-core = { path = "crates/tpt-policy-core" }
tpt-schema = { path = "crates/tpt-schema" }
tpt-report = { path = "crates/tpt-report" }
tpt-commercial-cli = { path = "crates/tpt-commercial-cli" }
tpt-data-core = { path = "crates/tpt-data-core" }
tpt-document = { path = "crates/tpt-document" }

[workspace.lints.rust]
unsafe_code = "forbid"
