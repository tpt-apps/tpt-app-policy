[workspace]
resolver = "2"
members = [
    "crates/tpt-policy-core",
    "crates/tpt-schema",
    "crates/tpt-report",
    "crates/tpt-commercial-cli",
    "crates/tpt-app-policy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE.txt"
repository = "https://github.com/TPT-Solutions/tpt-app-policy"
publish = false

[workspace.dependencies]
# Shared third-party dependencies. Added here as each phase needs them.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"

# Internal crates
tpt-policy-core = { path = "crates/tpt-policy-core" }
tpt-schema = { path = "crates/tpt-schema" }
tpt-report = { path = "crates/tpt-report" }
tpt-commercial-cli = { path = "crates/tpt-commercial-cli" }

[workspace.lints.rust]
unsafe_code = "forbid"
