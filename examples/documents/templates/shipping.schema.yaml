schema: shipping
version: "1.0.0"
fields:
  shipment_id:
    type: string
    required: true
  ship_date:
    type: string
    required: true
    pattern: '^\d{4}-\d{2}-\d{2}$'
  carrier:
    type: string
    required: true
    enum: [NZPost, DHL, FedEx, UPS]
  weight_kg:
    type: number
    required: true
    min: 0
  destination.country:
    type: string
    required: true
    enum: [NZ, AU, US, GB, DE, FR]
